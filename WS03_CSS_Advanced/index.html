<!DOCTYPE html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./styles/styles.css" />
    <title>WS02</title>
  </head>

  <body>
    <h1>Tervetuloa!</h1>
    <p>My first paragraph.</p>
    <h2>Otsikko</h2>
    <img
      src="./images/Screenshot_20221109-231923_YouTube.jpg"
      alt="Toimintapää"
      class="filter-image"
    />

    <table>
      <tr>
        <th>Katuja</th>
        <th>Puistoja</th>
      </tr>
      <tr>
        <td>Kivikonkaari</td>
        <td>Hesperianpuisto</td>
      </tr>
      <tr>
        <td>Kotikonnuntie</td>
        <td>Alakivenpuisto</td>
      </tr>
      <tr>
        <td>Teollisuuskatu</td>
        <td>Linnanpellonpuisto</td>
      </tr>
    </table>

    <form>
      <label for="fname">Etunimi:</label><br />
      <input type="text" id="fname" name="fname" placeholder="Matti" /><br />
      <label for="lname">Sukunimi:</label><br />
      <input
        type="text"
        id="lname"
        name="lname"
        placeholder="Meikäläinen"
      /><br /><br />
      <input type="submit" value="Lähetä" />
    </form>

    <button class="transition-button">Hover me</button>

    <div class="animation-box"></div>

    <ul class="pseudo-list">
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
      <li>Item 4</li>
    </ul>

    <blockquote class="quote">This is a sample quote.</blockquote>
  </body>
</html>
